name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: Cargo.toml has $CARGO_VERSION but tag is $GITHUB_REF_NAME"
            exit 1
          fi

  build-linux:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libudev-dev
      - name: Setup toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebc-battery-tester-linux
          path: target/release/ebc_battery_tester

  build-windows:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebc-battery-tester-windows
          path: target/release/ebc_battery_tester.exe

  build-wasm:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build
        run: ./trunk build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebc-battery-tester-wasm
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-wasm]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ebc-battery-tester-linux
          path: artifacts/linux
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ebc-battery-tester-windows
          path: artifacts/windows
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: ebc-battery-tester-wasm
          path: artifacts/wasm
      - name: Prepare release assets
        run: |
          mv artifacts/linux/ebc_battery_tester artifacts/ebc-battery-tester-linux
          mv artifacts/windows/ebc_battery_tester.exe artifacts/ebc-battery-tester-windows.exe
          cd artifacts/wasm && zip -r ../ebc-battery-tester-wasm.zip . && cd ../..
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            artifacts/ebc-battery-tester-linux \
            artifacts/ebc-battery-tester-windows.exe \
            artifacts/ebc-battery-tester-wasm.zip \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
